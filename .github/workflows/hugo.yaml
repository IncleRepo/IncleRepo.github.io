name: GitHub Pages 배포

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Hugo 설치
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: GitHub Pages 설정
        id: pages
        uses: actions/configure-pages@v6

      - name: Hugo 사이트 빌드
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Seoul
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: 게시글 무결성 검사
        run: |
          set -euo pipefail

          if grep -RIl $'\uFFFD' content/posts public/posts; then
            echo "손상된 대체 문자(�)가 발견되었습니다."
            exit 1
          fi

          for source in content/posts/*.md; do
            slug="$(basename "$source" .md)"
            if [[ "$slug" == "_index" ]]; then
              continue
            fi

            page="public/posts/$slug/index.html"
            test -s "$page"
            grep -q '정리' "$page"
            grep -q '참고 자료' "$page"
          done

      - name: 빌드 결과 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
