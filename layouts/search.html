{{- define "main" }}

<section class="search-page">
  <header class="search-page-header">
    <h1>{{ .Title }}</h1>
  </header>

  <div id="searchbox" class="searchbox search-page-box" role="search">
    <div class="search-input-row">
      <svg class="search-input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>
      <input id="searchInput" disabled placeholder="{{ .Params.placeholder }}" aria-label="게시글 검색" type="search"
        autocomplete="off" maxlength="64">
    </div>
    <ul id="searchResults" class="searchResults search-page-results" aria-label="검색 결과"></ul>
  </div>
</section>

{{- end }}
