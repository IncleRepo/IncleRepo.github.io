<div
  class="article-table-scroll"
  role="region"
  aria-label="데이터 표 {{ add .Ordinal 1 }}"
  tabindex="0">
  <table
    {{- range $key, $value := .Attributes }}
      {{- if $value }}{{ printf " %s=%q" $key $value | safeHTMLAttr }}{{ end }}
    {{- end }}>
    <thead>
      {{- range .THead }}
      <tr>
        {{- range . }}
        <th
          scope="col"
          {{- with .Alignment }}{{ printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}{{ end }}>
          {{- .Text -}}
        </th>
        {{- end }}
      </tr>
      {{- end }}
    </thead>
    <tbody>
      {{- range .TBody }}
      <tr>
        {{- range . }}
        <td
          {{- with .Alignment }}{{ printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}{{ end }}>
          {{- .Text -}}
        </td>
        {{- end }}
      </tr>
      {{- end }}
    </tbody>
  </table>
</div>
