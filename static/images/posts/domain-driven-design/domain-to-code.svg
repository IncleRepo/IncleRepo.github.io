<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">현실 업무가 도메인 모델과 코드로 이어지는 과정</title>
  <desc id="desc">현실의 주문 업무에서 중요한 개념과 규칙을 추려 개념 모델을 만들고 이를 Java 객체와 메서드로 표현하는 흐름</desc>
  <rect width="1200" height="610" rx="28" fill="#f7f7f6"/>
  <g font-family="Pretendard, Noto Sans KR, sans-serif">
    <text x="64" y="72" font-size="30" font-weight="700" fill="#202124">현실 업무를 곧바로 클래스에 옮기지 않는다</text>
    <text x="64" y="110" font-size="18" fill="#686b70">업무에서 중요한 개념과 규칙을 먼저 찾고, 그 모델을 코드로 표현</text>

    <rect x="64" y="160" width="300" height="330" rx="22" fill="#ffffff" stroke="#d8dadd" stroke-width="2"/>
    <text x="94" y="208" font-size="23" font-weight="700" fill="#202124">현실의 주문 업무</text>
    <text x="94" y="258" font-size="18" fill="#44484d">· 주문에는 여러 상품이 있다</text>
    <text x="94" y="296" font-size="18" fill="#44484d">· 주문은 상태를 가진다</text>
    <text x="94" y="334" font-size="18" fill="#44484d">· 배송 후에는 취소할 수 없다</text>
    <text x="94" y="372" font-size="18" fill="#44484d">· 수량이 바뀌면 금액도 바뀐다</text>

    <path d="M380 325h76" stroke="#a9adb3" stroke-width="4" stroke-linecap="round"/>
    <path d="m447 315 13 10-13 10" fill="none" stroke="#a9adb3" stroke-width="4" stroke-linejoin="round"/>
    <text x="418" y="302" text-anchor="middle" font-size="15" fill="#686b70">모델링</text>

    <rect x="476" y="160" width="300" height="330" rx="22" fill="#ffffff" stroke="#386fae" stroke-width="3"/>
    <text x="506" y="208" font-size="23" font-weight="700" fill="#202124">개념 모델</text>
    <text x="506" y="250" font-size="17" fill="#686b70">업무를 설명하는 핵심 개념과 관계</text>
    <rect x="506" y="282" width="240" height="56" rx="12" fill="#edf4fb"/>
    <text x="626" y="317" text-anchor="middle" font-size="18" font-weight="650" fill="#315f95">Order · OrderLine</text>
    <rect x="506" y="354" width="240" height="56" rx="12" fill="#edf4fb"/>
    <text x="626" y="389" text-anchor="middle" font-size="18" font-weight="650" fill="#315f95">Money · OrderStatus</text>
    <text x="506" y="452" font-size="17" fill="#44484d">“배송 후 주문 취소 불가”</text>

    <path d="M792 325h76" stroke="#a9adb3" stroke-width="4" stroke-linecap="round"/>
    <path d="m859 315 13 10-13 10" fill="none" stroke="#a9adb3" stroke-width="4" stroke-linejoin="round"/>
    <text x="830" y="302" text-anchor="middle" font-size="15" fill="#686b70">Java로 표현</text>

    <rect x="888" y="160" width="248" height="330" rx="22" fill="#24272b"/>
    <text x="918" y="208" font-size="23" font-weight="700" fill="#ffffff">구현 모델</text>
    <text x="918" y="258" font-size="18" fill="#d8dde2">class Order</text>
    <text x="918" y="296" font-size="18" fill="#d8dde2">class OrderLine</text>
    <text x="918" y="334" font-size="18" fill="#d8dde2">record Money</text>
    <text x="918" y="372" font-size="18" fill="#d8dde2">enum OrderStatus</text>
    <rect x="918" y="410" width="188" height="54" rx="11" fill="#343a40"/>
    <text x="1012" y="444" text-anchor="middle" font-size="18" font-weight="650" fill="#8fc2ff">order.cancel()</text>

    <text x="64" y="555" font-size="17" fill="#686b70">도메인 모델은 Java 클래스나 DB 테이블에서 시작하지 않는다. 먼저 업무를 설명하고, 코드는 그 이해를 구현한다.</text>
  </g>
</svg>
