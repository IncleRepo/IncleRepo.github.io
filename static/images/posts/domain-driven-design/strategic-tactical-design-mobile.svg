<svg xmlns="http://www.w3.org/2000/svg" width="680" height="760" viewBox="0 0 680 760" role="img" aria-labelledby="title desc">
  <title id="title">DDD의 전략적 설계와 전술적 설계</title>
  <desc id="desc">전략적 설계는 업무와 모델의 경계를 찾고, 전술적 설계는 경계 안의 객체와 규칙을 코드로 표현한다</desc>
  <style>text { font-family:Pretendard,"Noto Sans KR",sans-serif; }</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#858c94"/></marker></defs>
  <rect width="680" height="760" fill="#202226"/>
  <rect x="34" y="36" width="612" height="286" rx="4" fill="#292c31" stroke="#78aeea" stroke-width="2"/>
  <text x="64" y="80" font-size="25" font-weight="700" fill="#78aeea">전략적 설계</text>
  <text x="64" y="115" font-size="17" fill="#aab0b7">업무와 모델의 큰 경계를 정한다</text>
  <rect x="64" y="151" width="154" height="58" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <rect x="236" y="151" width="186" height="58" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <rect x="440" y="151" width="176" height="58" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <text x="141" y="187" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f3f5">Subdomain</text>
  <text x="329" y="187" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f3f5">Bounded Context</text>
  <text x="528" y="187" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f3f5">Context Map</text>
  <text x="64" y="262" font-size="17" fill="#f1f3f5">어디까지 같은 모델과 언어를 사용할까?</text>
  <path d="M340 322V390" stroke="#858c94" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="363" font-size="15" fill="#aab0b7">경계 안으로</text>
  <rect x="34" y="404" width="612" height="310" rx="4" fill="#292c31" stroke="#858c94" stroke-width="2"/>
  <text x="64" y="448" font-size="25" font-weight="700" fill="#f1f3f5">전술적 설계</text>
  <text x="64" y="483" font-size="17" fill="#aab0b7">대상과 값, 변경 규칙을 코드로 표현한다</text>
  <rect x="64" y="519" width="134" height="58" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <rect x="216" y="519" width="174" height="58" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <rect x="408" y="519" width="208" height="58" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <text x="131" y="555" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f3f5">Entity</text>
  <text x="303" y="555" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f3f5">Value Object</text>
  <text x="512" y="555" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f3f5">Aggregate</text>
  <text x="64" y="641" font-size="17" fill="#f1f3f5">누가 어떤 규칙과 상태를 책임질까?</text>
</svg>
