<svg xmlns="http://www.w3.org/2000/svg" width="680" height="860" viewBox="0 0 680 860" role="img" aria-labelledby="title desc">
  <title id="title">이 글에서 다루는 DDD의 전략적 설계와 전술적 설계</title>
  <desc id="desc">전략적 설계는 업무와 모델의 경계를 정하고, 전술적 설계는 경계 안의 모델을 구체화한다. 유비쿼터스 언어는 두 설계를 관통한다.</desc>
  <style>text { font-family:Pretendard,"Noto Sans KR",sans-serif; }</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#858c94"/></marker></defs>
  <rect width="680" height="860" fill="#202226"/>
  <rect x="34" y="36" width="612" height="260" rx="4" fill="#292c31" stroke="#78aeea" stroke-width="2"/>
  <text x="64" y="80" font-size="25" font-weight="700" fill="#78aeea">전략적 설계</text>
  <text x="64" y="115" font-size="17" fill="#aab0b7">업무와 모델의 큰 경계를 정한다</text>
  <rect x="64" y="143" width="154" height="58" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <rect x="236" y="143" width="186" height="58" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <rect x="440" y="143" width="176" height="58" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <text x="141" y="179" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f3f5">Subdomain</text>
  <text x="329" y="179" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f3f5">Bounded Context</text>
  <text x="528" y="179" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f3f5">Context Map</text>
  <text x="64" y="251" font-size="17" fill="#f1f3f5">어디까지 같은 모델을 사용할까?</text>
  <path d="M340 296V340" stroke="#858c94" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="324" font-size="15" fill="#aab0b7">경계 안으로</text>
  <rect x="34" y="354" width="612" height="388" rx="4" fill="#292c31" stroke="#858c94" stroke-width="2"/>
  <text x="64" y="398" font-size="25" font-weight="700" fill="#f1f3f5">전술적 설계</text>
  <text x="64" y="433" font-size="17" fill="#aab0b7">경계 안의 모델을 구체화한다</text>
  <rect x="64" y="465" width="552" height="118" rx="4" fill="none" stroke="#78aeea" stroke-width="1.5"/>
  <text x="84" y="492" font-size="16" font-weight="700" fill="#78aeea">Aggregate</text>
  <rect x="84" y="507" width="230" height="54" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <rect x="334" y="507" width="262" height="54" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <text x="199" y="541" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f3f5">Entity</text>
  <text x="465" y="541" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f3f5">Value Object</text>
  <rect x="64" y="609" width="174" height="58" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <rect x="253" y="609" width="160" height="58" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <rect x="428" y="609" width="188" height="58" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <text x="151" y="645" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f3f5">Domain Service</text>
  <text x="333" y="645" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f3f5">Repository</text>
  <text x="522" y="645" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f3f5">Domain Event</text>
  <text x="64" y="710" font-size="17" fill="#f1f3f5">누가 어떤 규칙과 상태를 책임질까?</text>
  <rect x="34" y="766" width="612" height="58" rx="4" fill="#292c31" stroke="#4a4f56"/>
  <text x="340" y="801" text-anchor="middle" font-size="16" fill="#d5d9de"><tspan font-weight="700" fill="#78aeea">Ubiquitous Language</tspan><tspan> · 대화와 모델, 코드에서 같은 용어 사용</tspan></text>
</svg>
