<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">DDD의 전략적 설계와 전술적 설계</title>
  <desc id="desc">전략적 설계는 업무와 모델의 경계를 찾고, 전술적 설계는 경계 안의 객체와 규칙을 코드로 표현한다</desc>
  <style>text { font-family:Pretendard,"Noto Sans KR",sans-serif; }</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#858c94"/></marker></defs>
  <rect width="1200" height="380" fill="#202226"/>
  <rect x="46" y="48" width="470" height="284" rx="4" fill="#292c31" stroke="#78aeea" stroke-width="2"/>
  <text x="76" y="91" font-size="24" font-weight="700" fill="#78aeea">전략적 설계</text>
  <text x="76" y="125" font-size="16" fill="#aab0b7">업무와 모델의 큰 경계를 정한다</text>
  <rect x="76" y="161" width="122" height="58" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <rect x="216" y="161" width="142" height="58" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <rect x="376" y="161" width="110" height="58" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <text x="137" y="197" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f3f5">Subdomain</text>
  <text x="287" y="197" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f3f5">Bounded Context</text>
  <text x="431" y="197" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f3f5">Context Map</text>
  <text x="76" y="267" font-size="17" fill="#f1f3f5">어디까지 같은 모델과 언어를 사용할까?</text>
  <path d="M530 190H666" stroke="#858c94" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="598" y="171" text-anchor="middle" font-size="15" fill="#aab0b7">경계 안으로</text>
  <rect x="684" y="48" width="470" height="284" rx="4" fill="#292c31" stroke="#858c94" stroke-width="2"/>
  <text x="714" y="91" font-size="24" font-weight="700" fill="#f1f3f5">전술적 설계</text>
  <text x="714" y="125" font-size="16" fill="#aab0b7">대상과 값, 변경 규칙을 코드로 표현한다</text>
  <rect x="714" y="161" width="94" height="58" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <rect x="826" y="161" width="122" height="58" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <rect x="966" y="161" width="158" height="58" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <text x="761" y="197" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f3f5">Entity</text>
  <text x="887" y="197" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f3f5">Value Object</text>
  <text x="1045" y="197" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f3f5">Aggregate</text>
  <text x="714" y="267" font-size="17" fill="#f1f3f5">누가 어떤 규칙과 상태를 책임질까?</text>
</svg>
