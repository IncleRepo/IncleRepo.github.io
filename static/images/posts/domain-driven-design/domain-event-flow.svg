<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Domain Event와 Integration Event의 역할</title>
  <desc id="desc">주문 컨텍스트 내부에서 발생한 Domain Event가 내부 처리에 사용되고, 외부 계약인 Integration Event로 변환되어 결제와 쿠폰 컨텍스트에 전달된다</desc>
  <style>text { font-family:Pretendard,"Noto Sans KR",sans-serif; }</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#858c94"/></marker></defs>
  <rect width="1200" height="430" fill="#202226"/>
  <rect x="38" y="40" width="650" height="350" rx="4" fill="none" stroke="#78aeea" stroke-width="2"/>
  <rect x="60" y="25" width="166" height="30" fill="#202226"/>
  <text x="70" y="49" font-size="20" font-weight="700" fill="#78aeea">주문 컨텍스트</text>
  <rect x="78" y="132" width="158" height="82" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <text x="157" y="168" text-anchor="middle" font-size="19" font-weight="700" fill="#f1f3f5">Order.cancel()</text>
  <text x="157" y="194" text-anchor="middle" font-size="14" fill="#aab0b7">상태 변경</text>
  <path d="M236 173H322" stroke="#858c94" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="326" y="116" width="226" height="114" rx="4" fill="#283a50" stroke="#78aeea" stroke-width="2"/>
  <text x="439" y="157" text-anchor="middle" font-size="20" font-weight="700" fill="#f1f3f5">OrderCanceled</text>
  <text x="439" y="187" text-anchor="middle" font-size="16" fill="#78aeea">Domain Event</text>
  <text x="439" y="211" text-anchor="middle" font-size="14" fill="#aab0b7">이미 일어난 도메인 사건</text>
  <path d="M439 230V284" stroke="#858c94" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="326" y="288" width="226" height="62" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <text x="439" y="326" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f3f5">컨텍스트 내부 후속 처리</text>
  <path d="M552 173H724" stroke="#858c94" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="638" y="152" text-anchor="middle" font-size="14" fill="#aab0b7">외부 계약으로 변환</text>
  <rect x="728" y="112" width="274" height="122" rx="4" fill="#292c31" stroke="#78aeea" stroke-width="2"/>
  <text x="865" y="154" text-anchor="middle" font-size="18" font-weight="700" fill="#f1f3f5">OrderCanceled</text>
  <text x="865" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#f1f3f5">IntegrationEvent</text>
  <text x="865" y="210" text-anchor="middle" font-size="16" fill="#78aeea">Integration Event</text>
  <path d="M1002 173H1070" stroke="#858c94" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1074" y="96" width="92" height="66" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <rect x="1074" y="184" width="92" height="66" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <text x="1120" y="136" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f3f5">결제</text>
  <text x="1120" y="224" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f3f5">쿠폰</text>
  <text x="865" y="300" text-anchor="middle" font-size="15" fill="#aab0b7">컨텍스트 밖에 공개하는 메시지 계약</text>
</svg>
