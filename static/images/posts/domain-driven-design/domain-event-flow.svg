<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Spring Application Event와 Integration Event의 전달 범위</title>
  <desc id="desc">주문 도메인 이벤트는 Spring ApplicationEventPublisher를 통해 같은 애플리케이션 안에 전달할 수 있고, 외부 계약인 Integration Event로 변환한 뒤 Kafka를 거쳐 결제와 쿠폰 컨텍스트에 전달할 수 있다</desc>
  <style>text { font-family:Pretendard,"Noto Sans KR",sans-serif; }</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#858c94"/></marker></defs>
  <rect width="1200" height="480" fill="#202226"/>
  <rect x="30" y="38" width="640" height="404" rx="4" fill="none" stroke="#78aeea" stroke-width="2"/>
  <rect x="52" y="23" width="192" height="30" fill="#202226"/>
  <text x="62" y="47" font-size="20" font-weight="700" fill="#78aeea">주문 애플리케이션</text>
  <rect x="62" y="150" width="158" height="82" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <text x="141" y="186" text-anchor="middle" font-size="19" font-weight="700" fill="#f1f3f5">Order.cancel()</text>
  <text x="141" y="212" text-anchor="middle" font-size="14" fill="#aab0b7">주문 상태 변경</text>
  <path d="M220 191H286" stroke="#858c94" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="290" y="132" width="230" height="118" rx="4" fill="#283a50" stroke="#78aeea" stroke-width="2"/>
  <text x="405" y="174" text-anchor="middle" font-size="20" font-weight="700" fill="#f1f3f5">OrderCanceled</text>
  <text x="405" y="204" text-anchor="middle" font-size="16" fill="#78aeea">Domain Event</text>
  <text x="405" y="228" text-anchor="middle" font-size="14" fill="#aab0b7">이미 일어난 주문 사건</text>
  <path d="M405 250V304" stroke="#858c94" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="425" y="283" font-size="13" fill="#aab0b7">같은 애플리케이션 안</text>
  <rect x="270" y="308" width="270" height="92" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <text x="405" y="344" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f3f5">ApplicationEventPublisher</text>
  <text x="405" y="374" text-anchor="middle" font-size="14" fill="#aab0b7">@EventListener · @TransactionalEventListener</text>
  <path d="M520 191H700" stroke="#858c94" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="168" text-anchor="middle" font-size="14" fill="#aab0b7">외부 메시지 계약으로 변환</text>
  <rect x="704" y="128" width="246" height="126" rx="4" fill="#292c31" stroke="#78aeea" stroke-width="2"/>
  <text x="827" y="169" text-anchor="middle" font-size="18" font-weight="700" fill="#f1f3f5">OrderCanceled</text>
  <text x="827" y="194" text-anchor="middle" font-size="18" font-weight="700" fill="#f1f3f5">IntegrationEvent</text>
  <text x="827" y="226" text-anchor="middle" font-size="16" fill="#78aeea">Integration Event</text>
  <path d="M950 191H1008" stroke="#858c94" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1012" y="154" width="150" height="74" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <text x="1087" y="185" text-anchor="middle" font-size="18" font-weight="700" fill="#f1f3f5">Kafka</text>
  <text x="1087" y="209" text-anchor="middle" font-size="13" fill="#aab0b7">메시지 브로커</text>
  <path d="M1087 228V304" stroke="#858c94" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="932" y="308" width="138" height="72" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <rect x="1080" y="308" width="100" height="72" rx="4" fill="#30343a" stroke="#4a4f56"/>
  <text x="1001" y="351" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f3f5">결제 컨텍스트</text>
  <text x="1130" y="351" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f3f5">쿠폰</text>
</svg>
