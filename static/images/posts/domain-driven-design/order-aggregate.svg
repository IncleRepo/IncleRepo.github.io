<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">주문 애그리거트의 구조</title>
  <desc id="desc">주문 애그리거트 루트를 통해 주문 항목과 배송지 값을 변경하며 주문의 규칙을 함께 지키는 구조</desc>
  <rect width="1200" height="610" rx="28" fill="#f7f7f6"/>
  <g font-family="Pretendard, Noto Sans KR, sans-serif">
    <text x="64" y="72" font-size="30" font-weight="700" fill="#202124">Aggregate는 함께 지켜야 할 규칙의 경계다</text>
    <text x="64" y="110" font-size="18" fill="#686b70">외부에서는 Order만 통하고, 내부 객체는 Order가 허용한 방식으로 변경</text>

    <rect x="68" y="155" width="1064" height="380" rx="26" fill="#ffffff" stroke="#386fae" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="96" y="196" font-size="18" font-weight="650" fill="#386fae">ORDER AGGREGATE</text>

    <rect x="122" y="238" width="300" height="230" rx="20" fill="#24272b"/>
    <text x="152" y="287" font-size="25" font-weight="700" fill="#ffffff">Order</text>
    <text x="152" y="321" font-size="17" fill="#cfd3d8">Aggregate Root · Entity</text>
    <line x1="152" y1="346" x2="392" y2="346" stroke="#555b62"/>
    <text x="152" y="383" font-size="17" fill="#ffffff">cancel()</text>
    <text x="152" y="415" font-size="17" fill="#ffffff">changeQuantity()</text>
    <text x="152" y="447" font-size="17" fill="#ffffff">changeShippingAddress()</text>

    <path d="M438 302h94" stroke="#a9adb3" stroke-width="3"/>
    <path d="m525 293 12 9-12 9" fill="none" stroke="#a9adb3" stroke-width="3"/>
    <path d="M438 406h94" stroke="#a9adb3" stroke-width="3"/>
    <path d="m525 397 12 9-12 9" fill="none" stroke="#a9adb3" stroke-width="3"/>

    <rect x="552" y="225" width="262" height="150" rx="18" fill="#edf4fb" stroke="#b8cee5" stroke-width="2"/>
    <text x="580" y="270" font-size="23" font-weight="700" fill="#202124">OrderLine</text>
    <text x="580" y="305" font-size="17" fill="#53606d">Entity</text>
    <text x="580" y="340" font-size="16" fill="#44484d">상품 · 수량 · 주문 가격</text>

    <rect x="552" y="393" width="262" height="110" rx="18" fill="#f1f4ef" stroke="#c8d5c8" stroke-width="2"/>
    <text x="580" y="438" font-size="23" font-weight="700" fill="#202124">ShippingAddress</text>
    <text x="580" y="474" font-size="17" fill="#53606d">Value Object</text>

    <rect x="858" y="248" width="218" height="204" rx="18" fill="#fff8eb" stroke="#e2c996" stroke-width="2"/>
    <text x="886" y="293" font-size="21" font-weight="700" fill="#202124">지켜야 할 규칙</text>
    <text x="886" y="335" font-size="16" fill="#44484d">· 배송 후 취소 불가</text>
    <text x="886" y="369" font-size="16" fill="#44484d">· 수량은 1개 이상</text>
    <text x="886" y="403" font-size="16" fill="#44484d">· 총금액 재계산</text>

    <text x="64" y="575" font-size="17" fill="#686b70">Root를 거치게 만드는 이유는 객체를 감추기 위해서가 아니라, 변경할 때 빠뜨리면 안 되는 규칙을 한곳에서 지키기 위해서다.</text>
  </g>
</svg>
