<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Order Aggregate 구조</title>
  <desc id="desc">Order Root를 통해 OrderLine과 ShippingAddress를 변경하는 구조</desc>
  <rect width="1200" height="480" fill="#f7f7f6"/>
  <g font-family="Pretendard, Noto Sans KR, sans-serif">
    <rect x="64" y="50" width="1072" height="350" rx="8" fill="none" stroke="#3568a8" stroke-width="3"/>
    <text x="92" y="91" font-size="20" font-weight="700" fill="#3568a8">Order Aggregate</text>
    <rect x="112" y="145" width="270" height="180" rx="6" fill="#202124"/>
    <text x="140" y="187" font-size="23" font-weight="700" fill="#ffffff">Order</text>
    <text x="140" y="217" font-size="15" fill="#d8dadd">Aggregate Root · Entity</text>
    <line x1="140" y1="240" x2="354" y2="240" stroke="#5f646a"/>
    <text x="140" y="272" font-size="16" fill="#ffffff">cancel()</text>
    <text x="140" y="301" font-size="16" fill="#ffffff">changeQuantity()</text>
    <line x1="382" y1="205" x2="475" y2="205" stroke="#8b9096" stroke-width="2"/>
    <path d="M465 195l12 10-12 10" fill="none" stroke="#8b9096" stroke-width="2"/>
    <line x1="382" y1="285" x2="475" y2="285" stroke="#8b9096" stroke-width="2"/>
    <path d="M465 275l12 10-12 10" fill="none" stroke="#8b9096" stroke-width="2"/>
    <rect x="477" y="145" width="250" height="120" rx="6" fill="#ffffff" stroke="#51565c" stroke-width="2"/>
    <text x="505" y="188" font-size="21" font-weight="700" fill="#202124">OrderLine</text>
    <text x="505" y="220" font-size="15" fill="#62666b">Entity · 상품 · 수량 · 주문 가격</text>
    <rect x="477" y="285" width="250" height="80" rx="6" fill="#ffffff" stroke="#51565c" stroke-width="2"/>
    <text x="505" y="321" font-size="20" font-weight="700" fill="#202124">ShippingAddress</text>
    <text x="505" y="348" font-size="15" fill="#62666b">Value Object</text>
    <line x1="770" y1="128" x2="770" y2="365" stroke="#d0d3d6"/>
    <text x="816" y="171" font-size="19" font-weight="700" fill="#202124">Root가 지키는 규칙</text>
    <text x="816" y="219" font-size="17" fill="#44484d">배송 후에는 취소할 수 없다</text>
    <text x="816" y="258" font-size="17" fill="#44484d">수량은 1개 이상이어야 한다</text>
    <text x="816" y="297" font-size="17" fill="#44484d">수량 변경 후 총금액을 다시 계산한다</text>
  </g>
</svg>
