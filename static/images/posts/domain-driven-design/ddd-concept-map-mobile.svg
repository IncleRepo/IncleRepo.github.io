<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img" aria-labelledby="title desc">
  <title id="title">DDD를 이해하는 흐름</title>
  <desc id="desc">업무 이해에서 언어와 모델, 경계와 규칙, 실행과 협력으로 이어지는 네 단계</desc>
  <style>text { font-family:Pretendard,"Noto Sans KR",sans-serif; }</style>
  <rect width="680" height="600" fill="#202226"/>
  <line x1="82" y1="96" x2="82" y2="486" stroke="#858c94" stroke-width="3"/>
  <g transform="translate(48 48)">
    <circle cx="34" cy="48" r="28" fill="#283a50"/><text x="34" y="56" text-anchor="middle" font-size="19" font-weight="700" fill="#78aeea">1</text>
    <text x="88" y="41" font-size="25" font-weight="700" fill="#f1f3f5">업무 이해</text><text x="88" y="72" font-size="17" fill="#aab0b7">도메인 · 도메인 전문가</text>
  </g>
  <g transform="translate(48 178)">
    <circle cx="34" cy="48" r="28" fill="#283a50"/><text x="34" y="56" text-anchor="middle" font-size="19" font-weight="700" fill="#78aeea">2</text>
    <text x="88" y="41" font-size="25" font-weight="700" fill="#f1f3f5">언어와 모델</text><text x="88" y="72" font-size="17" fill="#aab0b7">유비쿼터스 언어 · 도메인 모델</text>
  </g>
  <g transform="translate(48 308)">
    <circle cx="34" cy="48" r="28" fill="#283a50"/><text x="34" y="56" text-anchor="middle" font-size="19" font-weight="700" fill="#78aeea">3</text>
    <text x="88" y="41" font-size="25" font-weight="700" fill="#f1f3f5">경계와 규칙</text><text x="88" y="72" font-size="17" fill="#aab0b7">바운디드 컨텍스트 · 애그리거트</text>
  </g>
  <g transform="translate(48 438)">
    <circle cx="34" cy="48" r="28" fill="#283a50"/><text x="34" y="56" text-anchor="middle" font-size="19" font-weight="700" fill="#78aeea">4</text>
    <text x="88" y="41" font-size="25" font-weight="700" fill="#f1f3f5">실행과 협력</text><text x="88" y="72" font-size="17" fill="#aab0b7">응용 서비스 · 저장소 · 이벤트</text>
  </g>
</svg>
