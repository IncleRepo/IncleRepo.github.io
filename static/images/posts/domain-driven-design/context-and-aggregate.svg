    <rect x="120" y="307" width="307" height="55" rx="4" fill="#ffffff" stroke="#8b9096"/>
    <text x="274" y="341" text-anchor="middle" font-size="16">Money · ShippingAddress</text>
    <rect x="492" y="140" width="218" height="154" rx="6" fill="#ffffff" stroke="#51565c" stroke-width="2"/>
